<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor Tool - Court Bundle Tools</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='buntool.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
        }
        .header p {
            margin: 10px 0 0 0;
            font-size: 1.1em;
            opacity: 0.9;
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 30px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }
        .back-link:hover {
            opacity: 0.8;
        }
        .content {
            padding: 40px 30px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section h3 {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .upload-zone {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            background: #f8f9ff;
            transition: all 0.3s ease;
        }
        .upload-zone:hover {
            background: #eef0ff;
            border-color: #764ba2;
        }
        .upload-zone.dragover {
            background: #e3e8ff;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }
        .upload-zone input {
            display: none;
        }
        .upload-icon {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 10px;
        }
        .file-meta {
            margin-top: 12px;
            color: #555;
            font-size: 0.95em;
        }
        .editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toolbar-right input {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            min-width: 260px;
        }
        .secondary-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }
        .secondary-btn:hover {
            background: #e0e0e0;
        }
        .page-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .page-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fff;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: move;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .page-item.dragging {
            opacity: 0.6;
            transform: scale(0.98);
            background: #f4f6ff;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .page-badges {
            display: flex;
            gap: 6px;
            font-size: 0.75em;
        }
        .badge {
            background: #f0f0f0;
            color: #444;
            padding: 2px 6px;
            border-radius: 999px;
        }
        .page-preview {
            background: #f8f9ff;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 140px;
        }
        .page-preview canvas {
            max-width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        .page-actions {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            border: 1px solid #ddd;
            background: #fafafa;
            border-radius: 6px;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            background: #e9ecff;
            border-color: #667eea;
        }
        .action-btn.danger {
            border-color: #ff7777;
            background: #fff4f4;
            color: #a20000;
        }
        .action-btn.danger:hover {
            background: #ffe6e6;
        }
        .help-text {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
            font-style: italic;
        }
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.05em;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .loader {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .error-modal.show {
            display: flex;
        }
        .error-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 520px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .error-content h2 {
            color: #ff4444;
            margin-top: 0;
        }
        .error-content p {
            color: #666;
            margin-bottom: 20px;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 720px) {
            .toolbar-right {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }
            .toolbar-right input {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="{{ url_for('index') }}" class="back-link">Back to Bundle Tool</a>
            <h1>PDF Editor Tool</h1>
            <p>Reorder, delete, and rotate pages before downloading.</p>
        </div>
        <div class="content">
            <form id="editorForm">
                <div class="form-section">
                    <h3>1. Upload a PDF</h3>
                    <div id="uploadZone" class="upload-zone">
                        <div class="upload-icon material-icons">cloud_upload</div>
                        <div>Click to select a PDF or drag it here</div>
                        <input type="file" id="fileInput" accept=".pdf">
                    </div>
                    <div id="fileMeta" class="file-meta hidden"></div>
                </div>

                <div id="editorSection" class="form-section hidden">
                    <h3>2. Edit pages</h3>
                    <div class="editor-toolbar">
                        <div class="toolbar-left">
                            <strong id="pageCount">0 pages</strong>
                            <button type="button" class="secondary-btn" id="resetEdits">Reset edits</button>
                        </div>
                        <div class="toolbar-right">
                            <label for="outputFilename">Output filename</label>
                            <input type="text" id="outputFilename" placeholder="edited_document.pdf">
                        </div>
                    </div>
                    <div id="pageList" class="page-list"></div>
                    <div class="help-text">Drag pages to reorder. Use the buttons to rotate or delete.</div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn" disabled>Apply edits and download</button>
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <div>Processing PDF...</div>
                </div>
            </form>
        </div>
    </div>

    <div class="error-modal" id="errorModal">
        <div class="error-content">
            <h2>Error</h2>
            <p id="errorMessage"></p>
            <button type="button" class="secondary-btn" onclick="closeErrorModal()">Close</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="{{ url_for('static', filename='pdf_editor_tool.js') }}"></script>
</body>
</html>
